site_name: scorecardpl
site_description: Polars-first credit scoring toolkit (WOE/IV, binning, scorecard)
site_url: https://example.com/scorecardpl
repo_url: https://example.com/repo

theme:
  name: material
  features:
    - navigation.instant
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Quickstart: quickstart.md
  - Advanced Binning: advanced-binning.md
  - Large-Scale Guide: large-scale-guide.md
  - Calibration: calibration.md
  - SHAP Scorecard: shap-scorecard.md
  - API Reference: api.md

docs_dir: docs
